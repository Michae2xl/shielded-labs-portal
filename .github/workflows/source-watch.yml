# Daily check of the sources the portal copies by hand: shieldedlabs.net, the
# forum threads it cites, the Crosslink release behind its guide and the dated
# governance files. Anything to review lands in one open issue; nothing here
# edits the repository. See docs/MAINTAINING.md.
name: Source watch

on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test the checks
        run: python3 scripts/shielded-preview/test-check-sources.py
      - name: Check the sources
        run: python3 scripts/shielded-preview/check-sources.py --days 1.1 --out build/source-report.md
      - name: File or update the review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s build/source-report.md ]; then echo 'Nothing to review.'; exit 0; fi
          title='Source changes to review'
          issue="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -z "$issue" ]; then
            gh issue create --title "$title" --body-file build/source-report.md
            exit 0
          fi
          last="$(gh issue view "$issue" --json body,comments --jq '([.body] + [.comments[].body]) | last')"
          if [ "$last" = "$(cat build/source-report.md)" ]; then echo 'Same report as last time.'; exit 0; fi
          gh issue comment "$issue" --body-file build/source-report.md
